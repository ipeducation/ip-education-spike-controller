<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4B14E5">
  <title>IP Education | وحدة التحكم بروبوت SPIKE Prime</title>
  <style>
    :root {
      --bg: #120b1f;
      --panel: #1b1430;
      --panel2: #241a40;
      --text: #eef4ff;
      --muted: #c2b7db;
      --accent: #5b22e8;
      --ok: #26c281;
      --danger: #ef476f;
      --button: #2b2147;
      --button2: #3b2a63;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2a1649 0%, #120b1f 55%, #0d0816 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .app {
      width: min(520px, 100%);
      background: rgba(18, 27, 45, 0.95);
      border: 1px solid #4a2b78;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 18px 50px rgba(40,10,75,.38);
    }

    h1 {
      margin: 0 0 5px;
      font-size: 28px;
      letter-spacing: .3px;
    }


    .brand-header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .title-block h1 {
      margin: 0 0 5px;
      font-size: 26px;
      letter-spacing: .2px;
      line-height: 1.35;
    }

    .brand-name {
      color: #d83f91;
      font-weight: 800;
      white-space: nowrap;
    }

    .brand-logo {
      width: 145px;
      height: 70px;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    .public-note {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #2d2450;
      text-align: center;
      color: #d7c8ff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
    }

    .contact-line {
      margin-top: 4px;
      direction: ltr;
      font-size: 12px;
      font-weight: 600;
    }

    .contact-line a {
      color: #ef84bd;
      text-decoration: none;
    }

    .contact-line a:hover {
      text-decoration: underline;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 18px;
      font-size: 14px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }

    button {
      border: 0;
      color: var(--text);
      background: var(--button);
      border-radius: 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    button:active { transform: scale(.98); }

    #connectBtn {
      min-height: 52px;
      padding: 0 18px;
      background: linear-gradient(135deg, #5b22e8, #8b2fcf);
    }

    .status {
      background: #140e24;
      border: 1px solid #472c70;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.6;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #7b879b;
      margin-left: 7px;
      vertical-align: middle;
    }

    .dot.ok { background: var(--ok); box-shadow: 0 0 12px rgba(38,194,129,.45); }
    .dot.bad { background: var(--danger); }

    .controller {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 86px);
      gap: 12px;
      direction: ltr;
      max-width: 360px;
      margin: 0 auto 18px;
    }

    .control {
      font-size: 34px;
      background: linear-gradient(180deg, var(--button2), var(--button));
      border: 1px solid #3b4e70;
    }

    .control small {
      display: block;
      direction: rtl;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    #forward { grid-column: 2; grid-row: 1; }
    #left    { grid-column: 1; grid-row: 2; }
    #stop    { grid-column: 2; grid-row: 2; background: var(--danger); border-color: #ff6c8b; }
    #right   { grid-column: 3; grid-row: 2; }
    #back    { grid-column: 2; grid-row: 3; }

    .lifts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      direction: ltr;
      margin: 0 auto 18px;
      max-width: 360px;
    }

    .lift-group {
      display: grid;
      gap: 10px;
      direction: rtl;
    }

    .lift-group-title {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .lift-control {
      min-height: 76px;
      font-size: 28px;
      background: linear-gradient(180deg, #d83f91, #8b2fcf);
      border: 1px solid #ef84bd;
    }

    .log {
      background: #09111e;
      border: 1px solid #3e2a5e;
      border-radius: 14px;
      padding: 12px;
      min-height: 110px;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      margin-top: 14px;
    }

    @media (max-height: 700px) {
      .controller { grid-template-rows: repeat(3, 72px); }
      .app { padding: 15px; }
    }
  </style>
</head>

    <div class="topbar">
      <button id="connectBtn">اتصال بالـ SPIKE</button>
    </div>

    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">غير متصل</span>
    </div>

    <section class="controller" aria-label="عصا التحكم">
      <button class="control" id="forward" data-cmd="F" data-stop="S">▲<small>أمام</small></button>
      <button class="control" id="left" data-cmd="L" data-stop="S">◀<small>يسار</small></button>
      <button class="control" id="right" data-cmd="R" data-stop="S">▶<small>يمين</small></button>
      <button class="control" id="back" data-cmd="B" data-stop="S">▼<small>خلف</small></button>
    </section>

    <section class="lifts" aria-label="الرافعات">
      <div class="lift-group">
        <div class="lift-group-title">الرافعة 1</div>
        <button class="lift-control" id="lift1up" data-cmd="1" data-stop="5">▲<small>رفع</small></button>
        <button class="lift-control" id="lift1down" data-cmd="2" data-stop="5">▼<small>خفض</small></button>
      </div>

      <div class="lift-group">
        <div class="lift-group-title">الرافعة 2</div>
        <button class="lift-control" id="lift2up" data-cmd="3" data-stop="6">▲<small>رفع</small></button>
        <button class="lift-control" id="lift2down" data-cmd="4" data-stop="6">▼<small>خفض</small></button>
      </div>
    </section>

    <div class="log" id="log">جاهز.</div>

    <footer class="public-note">
      <div>نسخة تجريبية عامة ضمن المستوى الاول ويتم تطويرها حاليا</div>
      <div class="contact-line">
        <a href="https://www.ipeducation.co" target="_blank" rel="noopener noreferrer">www.ipeducation.co</a>
        <span> - </span>
        <span>00962781999733</span>
      </div>
    </footer>
  </main>

<script>
(() => {
  const PYBRICKS_SERVICE_UUID =
    "c5f50001-8280-46da-89f4-6d8051e4aeef";

  const PYBRICKS_COMMAND_EVENT_UUID =
    "c5f50002-8280-46da-89f4-6d8051e4aeef";

  const STDIN_COMMAND = 0x06;

  let device = null;
  let characteristic = null;
  let writeChain = Promise.resolve();

  const connectBtn = document.getElementById("connectBtn");
  const statusText = document.getElementById("statusText");
  const dot = document.getElementById("dot");
  const logBox = document.getElementById("log");

  function log(message) {
    const time = new Date().toLocaleTimeString("ar-JO");
    logBox.textContent = `[${time}] ${message}`;
  }

  function setStatus(text, state = "") {
    statusText.textContent = text;
    dot.className = "dot " + state;
  }

  function hex(bytes) {
    return Array.from(bytes)
      .map(b => b.toString(16).padStart(2, "0").toUpperCase())
      .join(" ");
  }

  async function sendByteCommand(letter) {
    if (!characteristic) {
      log("لا يوجد اتصال بالـSPIKE.");
      return;
    }

    const ascii = letter.charCodeAt(0);
    const packet = new Uint8Array([STDIN_COMMAND, ascii]);

    // Queue writes so that rapid button presses do not overlap GATT operations.
    writeChain = writeChain
      .catch(() => {})
      .then(async () => {
        try {
          await characteristic.writeValueWithResponse(packet);
          log(`أُرسل ${letter}  →  ${hex(packet)}`);
        } catch (err) {
          log(`خطأ أثناء الإرسال: ${err.message}`);
        }
      });

    return writeChain;
  }

  async function connect() {
    if (!navigator.bluetooth) {
      setStatus("Web Bluetooth غير متاح في هذا المتصفح.", "bad");
      log("المتصفح لا يدعم Web Bluetooth.");
      return;
    }

    try {
      setStatus("اختر SPIKE من القائمة");
      log("فتح نافذة اختيار جهاز Bluetooth");

      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [PYBRICKS_SERVICE_UUID] }]
      });

      device.addEventListener("gattserverdisconnected", () => {
        characteristic = null;
        setStatus("انقطع الاتصال.", "bad");
        connectBtn.textContent = "إعادة الاتصال";
        log("انقطع اتصال Bluetooth.");
      });

      log(`تم اختيار: ${device.name || "Pybricks Hub"}`);

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(PYBRICKS_SERVICE_UUID);
      characteristic = await service.getCharacteristic(PYBRICKS_COMMAND_EVENT_UUID);

      setStatus(`متصل: ${device.name || "Pybricks Hub"}`, "ok");
      connectBtn.textContent = "متصل";
      log("تم الاتصال بخدمة Pybricks بنجاح.");
      log("يمكن الآن إرسال أوامر WRITE_STDIN.");
    } catch (err) {
      setStatus("فشل الاتصال.", "bad");
      log(`فشل الاتصال: ${err.message}`);
    }
  }

  connectBtn.addEventListener("click", async () => {
    if (characteristic) {
      if (device?.gatt?.connected) {
        log("الاتصال قائم بالفعل.");
        return;
      }
    }
    await connect();
  });

  function bindHoldButton(button) {
    let active = false;
    const command = button.dataset.cmd;
    const stopCommand = button.dataset.stop || "S";

    const start = async (event) => {
      event.preventDefault();
      if (active) return;
      active = true;

      try {
        button.setPointerCapture?.(event.pointerId);
      } catch (_) {}

      try {
        await sendByteCommand(command);
      } catch (_) {}
    };

    const stop = async (event) => {
      event.preventDefault();
      if (!active) return;
      active = false;

      try {
        await sendByteCommand(stopCommand);
      } catch (_) {}
    };

    button.addEventListener("pointerdown", start);
    button.addEventListener("pointerup", stop);
    button.addEventListener("pointercancel", stop);

    button.addEventListener("lostpointercapture", async () => {
      if (!active) return;
      active = false;

      try {
        await sendByteCommand(stopCommand);
      } catch (_) {}
    });
  }

  document.querySelectorAll(".control, .lift-control").forEach(bindHoldButton);

  window.addEventListener("pagehide", () => {
    try {
      if (characteristic) {
        characteristic.writeValueWithResponse(new Uint8Array([STDIN_COMMAND, "S".charCodeAt(0)]));
      }
    } catch (_) {}
  });
})();
</script>
